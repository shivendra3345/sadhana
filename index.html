<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <style>
      :root {
        color-scheme: light;
        --bg-start: #fff1f2;
        --bg-end: #fdf2f8;
        --card: rgba(255, 255, 255, 0.92);
        --text: #831843;
        --accent: #ec4899;
        --accent-dark: #be185d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      }

      main {
        width: min(100%, 680px);
      }

      .card {
        background: var(--card);
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 20px 60px rgba(131, 24, 67, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.7;
      }

      .message {
        margin-top: 24px;
        padding: 18px;
        border-radius: 16px;
        background: #fff;
      }

      button {
        margin-top: 28px;
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 700;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <p>🎉 A special celebration page 🎉</p>
        <h1>Happy Birthday!</h1>
        <p>
          Wishing you a day filled with laughter, love, cake, and unforgettable
          moments.
        </p>
        <div class="message" id="message">
          May your year ahead be bright, joyful, and full of beautiful
          surprises.
        </div>
        <button type="button" id="wish-button">Show another wish</button>
      </section>
    </main>

    <script>
      const wishes = [
        "May your year ahead be bright, joyful, and full of beautiful surprises.",
        "Hope your birthday is as wonderful and inspiring as you are.",
        "Wishing you endless smiles, sweet memories, and all your favorite things today.",
        "May every new day bring you happiness, success, and reasons to celebrate."
      ];

      const message = document.getElementById("message");
      const button = document.getElementById("wish-button");
      let index = 0;

      button.addEventListener("click", () => {
        index = (index + 1) % wishes.length;
        message.textContent = wishes[index];
      });
    </script>
  </body>
</html>
